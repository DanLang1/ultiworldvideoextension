<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Ultiworld Skip and Resume</title>
  <style>
    body {
      width: 300px;
      margin: 0;
      padding: 16px;
      font-family: system-ui, sans-serif;
      font-size: 13px;
    }
    h3 { margin: 0 0 12px; font-size: 15px; }
    .field { margin-bottom: 12px; }
    label { display: block; margin-bottom: 6px; color: #555; }
    .input-row { display: flex; align-items: center; gap: 8px; }
    input[type="number"] { width: 60px; padding: 6px 8px; }
    .toggle { display: flex; align-items: center; gap: 8px; cursor: pointer; }
    .progress-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      border-top: 1px solid #ddd;
      margin-top: 12px;
      padding-top: 10px;
    }
    .progress-header h4 { margin: 0; font-size: 12px; text-transform: uppercase; color: #888; }
    button.clear { background: none; border: none; color: #c00; font-size: 11px; cursor: pointer; padding: 0; }
    button.clear:hover { text-decoration: underline; }
    #progressList { max-height: 240px; overflow-y: auto; }
    .empty { color: #888; padding: 4px 0; }
    .item { display: flex; align-items: flex-start; gap: 8px; padding: 6px 0; border-bottom: 1px solid #eee; }
    .item:last-child { border-bottom: none; }
    .meta { flex: 1; min-width: 0; }
    .meta a { display: block; color: inherit; text-decoration: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .meta a:hover { text-decoration: underline; }
    .time { color: #888; font-size: 11px; margin-top: 2px; }
    button.del { background: none; border: none; color: #999; font-size: 16px; line-height: 1; cursor: pointer; padding: 0 4px; }
    button.del:hover { color: #c00; }
    .shortcuts { border-top: 1px solid #ddd; margin-top: 12px; padding-top: 10px; color: #666; font-size: 11px; }
    .key { font-family: monospace; }
    .disclaimer { color: #999; font-size: 10px; margin-top: 8px; }
  </style>
</head>
<body>
  <h3>Ultiworld Skip and Resume</h3>
  <div class="field">
    <label for="skipInput">Skip duration (seconds):</label>
    <div class="input-row">
      <input type="number" id="skipInput" min="1" max="60" value="5">
      <span>sec</span>
    </div>
  </div>
  <div class="field">
    <label class="toggle">
      <input type="checkbox" id="resumeToggle" checked>
      Resume where I left off
    </label>
  </div>
  <div class="progress-header">
    <h4>Saved positions</h4>
    <button class="clear" id="clearAll">Clear all</button>
  </div>
  <div id="progressList"></div>
  <div class="shortcuts">
    <b>Shortcuts:</b><br>
    <span class="key">&larr;</span> : Rewind<br>
    <span class="key">&rarr;</span> : Fast forward
  </div>
  <div class="disclaimer">Works on ultiworld.com. Not affiliated with Ultiworld.</div>
  <script src="popup.js"></script>
</body>
</html>
